name: Shared release fixture
on:
  workflow_dispatch:
permissions: {}
jobs:
  calculate:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: vhco-pro/gh-release-workflow/.github/workflows/gh-release.yml@b18de6d2f305f971afe01ba31e17bde5966b1567 # shared release
    with:
      runs-on: ubuntu-24.04
      dry-run: true
  verify:
    needs: [calculate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify the native dry-run outputs
        env:
          VERSION: ${{ needs.calculate.outputs.version }}
          TAGGED: ${{ needs.calculate.outputs.tagged }}
          TAG: ${{ needs.calculate.outputs.tag }}
          RELEASE_URL: ${{ needs.calculate.outputs.release-url }}
        run: |
          test -n "$VERSION"
          test "$TAGGED" = false
          test -z "$TAG"
          test -z "$RELEASE_URL"
