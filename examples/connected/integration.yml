name: Owned connected fixture
run-name: fixture-${{ inputs.proof-id }}
on:
  workflow_dispatch:
    inputs:
      proof-id:
        description: Unique owner-recorded case identifier.
        required: true
        type: string
      mode:
        type: choice
        default: full
        options: [full, write]
      repositories:
        description: Optional subset of the committed synthetic allowlist.
        type: string
        default: ''
permissions:
  contents: read
jobs:
  renovate:
    uses: vhco-pro/renovate-runner/.github/workflows/renovate.yml@FULL_COMMIT_SHA
    with:
      client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
      environment: renovate
      mode: ${{ inputs.mode }}
      repositories: ${{ inputs.repositories }}
